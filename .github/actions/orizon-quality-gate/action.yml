name: Orizon Quality Gate
description: Adaptive Orizon Tech quality gate for repository pull requests
inputs:
  install:
    description: Install dependencies before checks
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Resolve project runtime
      id: runtime
      shell: bash
      run: |
        if [ -f .nvmrc ]; then
          VERSION="$(tr -d '[:space:]' < .nvmrc)"
        elif [ -f .node-version ]; then
          VERSION="$(tr -d '[:space:]' < .node-version)"
        elif [ -f package.json ]; then
          VERSION="$(node -e "const p=require('./package.json'); process.stdout.write((p.engines&&p.engines.node)||'22')")"
        else
          VERSION="22"
        fi
        if [ -f bun.lock ] || [ -f bun.lockb ]; then MANAGER="bun";
        elif [ -f pnpm-lock.yaml ]; then MANAGER="pnpm";
        elif [ -f yarn.lock ]; then MANAGER="yarn";
        else MANAGER="npm"; fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"
    - name: Configure project Node version
      if: hashFiles('package.json') != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.runtime.outputs.version }}
    - name: Configure Bun
      if: steps.runtime.outputs.manager == 'bun'
      uses: oven-sh/setup-bun@v2
    - name: Run Orizon quality gate
      shell: bash
      env:
        ORIZON_GATE_INSTALL: ${{ inputs.install }}
      run: node "${{ github.action_path }}/../../../scripts/orizon/quality-gate.js"
